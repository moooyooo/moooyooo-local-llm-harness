# Typecheck, tests and the GUI build. macOS is where the harness is used and tested; Windows is supported by design
# but not yet verified, so its job may fail without failing the workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22, experimental: false }
          - { os: ubuntu-latest, node: 24, experimental: false }
          - { os: macos-latest, node: 24, experimental: false }
          - { os: windows-latest, node: 24, experimental: true }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
